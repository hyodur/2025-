[supervisord]
nodaemon=false
logfile=/home/user/webapp/fraction-game/logs/supervisord.log
pidfile=/home/user/webapp/fraction-game/supervisord.pid
childlogdir=/home/user/webapp/fraction-game/logs

[unix_http_server]
file=/home/user/webapp/fraction-game/supervisor.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/fraction-game/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:fraction-game-server]
command=python3 /home/user/webapp/fraction-game/stable-server.py
directory=/home/user/webapp/fraction-game
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/fraction-game/logs/server.log
stderr_logfile=/home/user/webapp/fraction-game/logs/server_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
user=user
