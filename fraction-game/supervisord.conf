[supervisord]
nodaemon=false
logfile=/home/user/webapp/fraction-game/logs/supervisord.log
pidfile=/home/user/webapp/fraction-game/logs/supervisord.pid
childlogdir=/home/user/webapp/fraction-game/logs

[unix_http_server]
file=/home/user/webapp/fraction-game/logs/supervisor.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/fraction-game/logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:fraction-game-dev]
command=npm run dev
directory=/home/user/webapp/fraction-game
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/fraction-game/logs/vite.log
stderr_logfile=/home/user/webapp/fraction-game/logs/vite_error.log
environment=NODE_ENV=development,PORT=3000
user=user