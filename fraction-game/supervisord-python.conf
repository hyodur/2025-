[supervisord]
nodaemon=false
logfile=/home/user/webapp/fraction-game/logs/supervisord.log
pidfile=/home/user/webapp/fraction-game/logs/supervisord.pid
childlogdir=/home/user/webapp/fraction-game/logs

[unix_http_server]
file=/home/user/webapp/fraction-game/logs/supervisor.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/fraction-game/logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:python-server]
command=python3 /home/user/webapp/fraction-game/server.py
directory=/home/user/webapp/fraction-game
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/fraction-game/logs/python-server.log
stderr_logfile=/home/user/webapp/fraction-game/logs/python-server-error.log
environment=PYTHONUNBUFFERED=1
user=user